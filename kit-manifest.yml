# Kit Manifest — File classification for safe upgrades
#
# override-safe:   Always safe to overwrite (nobody customizes these)
# new-only:        Only copy if file does NOT exist
# merge-required:  Projects customize these → NEVER auto-overwrite

override-safe:
  - scripts/render-diagrams.sh
  - templates/*.template
  - skills/reference/diagrams.md
  - skills/reference/ide-setup.md
  - skills/reference/project-structure.md
  - skills/reference/service-docs-standard.md
  - skills/_README-skills-index.md
  - skills/document-generation/thesis/reference/*.md
  - skills/document-generation/thesis/scripts/check-thesis-content-standard.sh

new-only:
  - memory/*.md
  - skills/quality/quality-audit.md
  - skills/reference/business-docs-3-layer.md
  - skills/document-generation/thesis/SKILL.md
  - skills/document-generation/thesis/templates/*.template
  - rules/thesis-content-standard.md
  # v2.8.0 — audit suite + workflow suite (new-only: projects customize skills)
  - skills/quality-audit/**
  - skills/quality/api-contract-audit/**
  - skills/quality/business-logic-audit/**
  - skills/quality/design-pattern-audit/**
  - skills/quality/ops-readiness-audit/**
  - skills/quality/performance-audit/**
  - skills/quality/security-audit/**
  - skills/quality/wave-pack-planner/**
  - skills/workflow/start-session/**
  - skills/workflow/end-session/**
  - skills/workflow/repo-status/**
  - skills/workflow/check-pr/**
  - skills/workflow/fix-pr/**
  - skills/workflow/start-pr/**

merge-required:
  - skills/core/brainstorming-methodology.md
  - skills/core/systematic-debugging.md
  - skills/core/task-breakdown-guide.md
  - skills/core/tdd-enforcement.md
  - skills/core/two-stage-code-review.md
  - skills/workflow/development-workflow.md
  - scripts/check-ci.sh
  - scripts/test-local.sh
  - scripts/pre-commit-check.sh
